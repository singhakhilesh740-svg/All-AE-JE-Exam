<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>NT Edit Questions</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;padding:14px}
    h1{font-size:16px;font-weight:800;color:#a78bfa;margin-bottom:4px}
    .sub{color:#64748b;font-size:12px;margin-bottom:16px}
    .card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:14px;margin-bottom:12px}
    .card-title{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:10px}
    label{display:block;font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:4px;margin-top:8px;text-transform:uppercase;letter-spacing:.04em}
    .auth-input,select,textarea{width:100%;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:8px 10px;color:#f1f5f9;font-size:13px;font-family:inherit;outline:none}
    textarea{min-height:90px;line-height:1.5}
    .auth-input:focus,select:focus,textarea:focus{border-color:#a78bfa}
    .btn{padding:7px 12px;border-radius:6px;border:none;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;margin-top:6px}
    .btn-primary{background:#a78bfa;color:#0f172a}
    .btn-danger{background:#ef4444;color:#fff}
    .btn-ghost{background:transparent;color:#94a3b8;border:1px solid #334155}
    .btn-success{background:#10b981;color:#fff}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .col{flex:1;min-width:140px}
    .q-item{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px;margin-bottom:8px}
    .q-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
    .q-text{font-size:13px;color:#f1f5f9;flex:1;line-height:1.4}
    .q-meta{font-size:10px;color:#64748b;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
    .q-tag{background:#1e293b;padding:2px 6px;border-radius:3px}
    .q-actions{display:flex;gap:4px;flex-shrink:0}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
    .modal.show{display:flex}
    .modal-content{background:#1e293b;border:1px solid #a78bfa;border-radius:10px;padding:18px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #a78bfa;color:#a78bfa;padding:8px 16px;border-radius:8px;font-size:12px;display:none;z-index:999}
    .empty{color:#64748b;font-size:12px;padding:16px;text-align:center;background:#0f172a;border:1px dashed #334155;border-radius:6px}
  </style>
</head>
<body>
  <h1>✏️ Edit Non-Tech Questions</h1>
  <div class="sub">Filter, edit, or delete questions uploaded to <code>nt_questions</code>.</div>

  <div class="card">
    <div class="card-title">🔍 Filter</div>
    <div class="row">
      <div class="col">
        <label>Type</label>
        <select id="fType"><option value="">All</option><option value="practice">Practice</option><option value="pyq">PYQ</option></select>
      </div>
      <div class="col">
        <label>Category</label>
        <select id="fCategory">
          <option value="">All</option>
          <option value="gs">GS</option>
          <option value="stategk">State GK</option>
          <option value="language">Language</option>
          <option value="aptitude">Aptitude</option>
        </select>
      </div>
      <div class="col">
        <label>Subsection</label>
        <input class="auth-input" id="fSubsection" placeholder="e.g. polity (optional)"/>
      </div>
      <div class="col">
        <label>Exam</label>
        <input class="auth-input" id="fExam" placeholder="exam id (optional)"/>
      </div>
    </div>
    <button class="btn btn-primary" id="loadBtn">🔍 Load Questions</button>
  </div>

  <div id="qList"><div class="empty">Apply a filter and click "Load Questions"</div></div>

  <!-- Edit modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <h3 style="color:#a78bfa;margin-bottom:12px">✏️ Edit Question</h3>
      <label>Question</label>
      <textarea id="eQuestion"></textarea>
      <label>Options (one per line, 0-based)</label>
      <textarea id="eOptions" style="min-height:120px"></textarea>
      <div class="row">
        <div class="col"><label>Correct Index (0-based)</label><input class="auth-input" id="eAnswer" type="number" min="0"/></div>
        <div class="col"><label>Subject</label><input class="auth-input" id="eSubject"/></div>
      </div>
      <label>Explanation</label>
      <textarea id="eExplanation"></textarea>
      <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-ghost" id="cancelEdit">Cancel</button>
        <button class="btn btn-success" id="saveEdit">💾 Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, getDocs, updateDoc, deleteDoc, query, where, limit } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const ADMIN_EMAIL = '112ce0489@gmail.com';
const cfg = {apiKey:"AIzaSyBJi1yjBwojb1cqcTdMwa53Rsb0Yzq7rMI",authDomain:"ae-exam-app.firebaseapp.com",projectId:"ae-exam-app",storageBucket:"ae-exam-app.firebasestorage.app",messagingSenderId:"101353507688",appId:"1:101353507688:web:82b31f2d6096387d7aa4dd"};
const app = getApps().length ? getApp() : initializeApp(cfg);
const auth = getAuth(app), db = getFirestore(app);
let questions = [], editingId = null;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
function escape(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

document.getElementById('loadBtn').onclick = async () => {
  const list = document.getElementById('qList');
  list.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const filters = [];
    const t = document.getElementById('fType').value;
    const c = document.getElementById('fCategory').value;
    const s = document.getElementById('fSubsection').value.trim();
    const e = document.getElementById('fExam').value.trim();
    if (t) filters.push(where('type','==',t));
    if (c) filters.push(where('category','==',c));
    if (s) filters.push(where('subsection','==',s));
    if (e) filters.push(where('exam','==',e));
    filters.push(limit(100));
    const q = filters.length ? query(collection(db,'nt_questions'), ...filters) : query(collection(db,'nt_questions'), limit(100));
    const snap = await getDocs(q);
    questions = [];
    snap.forEach(d => questions.push({ id: d.id, ...d.data() }));
    render();
  } catch(err) {
    list.innerHTML = '<div class="empty" style="color:#ef4444">Error: ' + err.message + '</div>';
  }
};

function render() {
  const list = document.getElementById('qList');
  if (questions.length === 0) { list.innerHTML = '<div class="empty">No matching questions.</div>'; return; }
  list.innerHTML = '';
  questions.forEach(q => {
    const correctOpt = q.options?.[q.answer] || '—';
    const item = document.createElement('div');
    item.className = 'q-item';
    item.innerHTML = `
      <div class="q-head">
        <div class="q-text">${escape(q.question)}</div>
        <div class="q-actions">
          <button class="btn btn-ghost" onclick="editQ('${q.id}')" style="padding:4px 8px;margin:0;font-size:10px">✏️</button>
          <button class="btn btn-danger" onclick="delQ('${q.id}')" style="padding:4px 8px;margin:0;font-size:10px">🗑</button>
        </div>
      </div>
      <div style="font-size:11px;color:#10b981;margin-bottom:4px">✓ ${escape(correctOpt)}</div>
      <div class="q-meta">
        <span class="q-tag">${escape(q.type || '?')}</span>
        <span class="q-tag">${escape(q.category || '?')}</span>
        <span class="q-tag">${escape(q.subsection || '?')}</span>
        <span class="q-tag">${escape(q.subject || 'all')}</span>
        ${q.exam ? `<span class="q-tag">📜 ${escape(q.exam)} ${q.year || ''}</span>` : ''}
      </div>`;
    list.appendChild(item);
  });
}

window.editQ = (id) => {
  const q = questions.find(x => x.id === id);
  if (!q) return;
  editingId = id;
  document.getElementById('eQuestion').value = q.question || '';
  document.getElementById('eOptions').value = (q.options || []).join('\n');
  document.getElementById('eAnswer').value = q.answer ?? 0;
  document.getElementById('eSubject').value = q.subject || 'all';
  document.getElementById('eExplanation').value = q.explanation || '';
  document.getElementById('editModal').classList.add('show');
};

document.getElementById('cancelEdit').onclick = () => document.getElementById('editModal').classList.remove('show');

document.getElementById('saveEdit').onclick = async () => {
  if (!editingId) return;
  const upd = {
    question: document.getElementById('eQuestion').value.trim(),
    options: document.getElementById('eOptions').value.split('\n').map(s=>s.trim()).filter(Boolean),
    answer: parseInt(document.getElementById('eAnswer').value, 10),
    subject: document.getElementById('eSubject').value.trim() || 'all',
    explanation: document.getElementById('eExplanation').value.trim(),
    updatedAt: new Date().toISOString()
  };
  if (upd.answer >= upd.options.length) { toast('❌ Answer index out of range'); return; }
  try {
    await updateDoc(doc(db, 'nt_questions', editingId), upd);
    toast('✅ Saved');
    document.getElementById('editModal').classList.remove('show');
    const idx = questions.findIndex(x => x.id === editingId);
    if (idx >= 0) Object.assign(questions[idx], upd);
    render();
  } catch(e) { toast('❌ ' + e.message); }
};

window.delQ = async (id) => {
  if (!confirm('Delete this question permanently?')) return;
  try {
    await deleteDoc(doc(db, 'nt_questions', id));
    toast('🗑 Deleted');
    questions = questions.filter(q => q.id !== id);
    render();
  } catch(e) { toast('❌ ' + e.message); }
};

onAuthStateChanged(auth, user => {
  if (!user || user.email !== ADMIN_EMAIL) document.getElementById('qList').innerHTML = '<div class="empty" style="color:#ef4444">🔒 Sign in as admin from parent page</div>';
});
</script>
</body>
</html>
