  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh;padding:16px}
    h1{font-size:18px;font-weight:800;color:#f59e0b;margin-bottom:4px}
    .sub{color:#64748b;font-size:13px;margin-bottom:20px}
    .section-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
    .sec-btn{padding:8px 16px;border-radius:8px;border:2px solid #334155;background:transparent;color:#64748b;font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}
    .sec-btn.active{color:#f59e0b;border-color:#f59e0b;background:rgba(245,158,11,.1)}
    .panel{display:none}.panel.active{display:block}
    /* Subsection card */
    .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:12px}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .card-title{font-size:14px;font-weight:700;color:#f1f5f9}
    .card-id{font-size:11px;color:#475569;background:#0f172a;padding:2px 6px;border-radius:4px;font-family:monospace}
    /* Subject card (level 2) */
    .subj-card{background:#0f172a;border:1px solid #334155;border-radius:8px;margin-bottom:8px}
    .subj-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;user-select:none}
    .subj-header:hover{background:rgba(245,158,11,.04);border-radius:8px}
    .subj-name{font-size:13px;font-weight:600;color:#f1f5f9;display:flex;align-items:center;gap:6px}
    .arrow{font-size:10px;color:#64748b;transition:transform .2s;display:inline-block}
    .arrow.open{transform:rotate(90deg)}
    .badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600}
    .badge-subj{background:#1e293b;color:#64748b}
    .badge-chap{background:rgba(59,130,246,.15);color:#60a5fa}
    .badge-topic{background:rgba(16,185,129,.12);color:#34d399}
    .subj-body{padding:0 12px 12px;display:none}
    .subj-body.open{display:block}
    /* Chapter card (level 3) */
    .chap-card{background:#0c1322;border:1px solid #1e293b;border-radius:6px;margin-bottom:6px}
    .chap-header{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;cursor:pointer;user-select:none}
    .chap-header:hover{background:rgba(96,165,250,.04);border-radius:6px}
    .chap-name{font-size:12px;font-weight:600;color:#cbd5e1;display:flex;align-items:center;gap:5px}
    .chap-body{padding:0 10px 10px;display:none}
    .chap-body.open{display:block}
    /* Topic chips (level 4) */
    .chip-wrap{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 6px}
    .t-chip{background:#1e293b;border:1px solid #334155;border-radius:4px;padding:3px 7px;font-size:10px;color:#94a3b8;display:flex;align-items:center;gap:3px}
    .t-chip .x{cursor:pointer;color:#ef4444;font-weight:700;font-size:11px}
    /* Inputs */
    .auth-input,textarea{background:#0f172a;border:1px solid #334155;border-radius:6px;padding:7px 10px;color:#f1f5f9;font-size:12px;font-family:inherit;outline:none;transition:border-color .15s}
    textarea{width:100%;resize:vertical;font-family:inherit}
    .auth-input:focus,textarea:focus{border-color:#f59e0b}
    .btn{padding:6px 12px;border-radius:6px;border:none;font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
    .btn-primary{background:#f59e0b;color:#000}
    .btn-blue{background:#3b82f6;color:#fff}
    .btn-green{background:#10b981;color:#fff}
    .btn-purple{background:#a78bfa;color:#0f172a}
    .btn-danger{background:#ef4444;color:#fff}
    .btn-ghost{background:transparent;border:1px solid #334155;color:#94a3b8}
    .row{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
    .add-subsection-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .bulk-box{border-top:1px dashed #334155;margin-top:8px;padding-top:8px}
    .bulk-lbl{font-size:10px;color:#64748b;margin-bottom:3px}
    .section-lbl{font-size:11px;font-weight:700;color:#94a3b8;margin:10px 0 5px;text-transform:uppercase;letter-spacing:.04em}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #f59e0b;color:#f59e0b;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;display:none;z-index:999}
    .loading{color:#64748b;font-size:13px;padding:20px 0}
    .icon-input{width:56px}
    .aptitude-note{background:rgba(139,92,246,.1);border:1px solid #6d28d9;border-radius:8px;padding:12px;font-size:12px;color:#a78bfa;margin-bottom:16px}
    .empty-topics{font-size:10px;color:#475569;font-style:italic}

// ── Migration: handle old string subjects or subjects without chapters ─────────
function migrate(arr){
  return (arr||[]).map(sub=>{
    sub.subjects=(sub.subjects||[]).map(s=>{
      if(typeof s==='string') return {name:s,chapters:[]};
      if(!s.chapters){
        // old format had topics[] directly — wrap each topic as a chapter
        s.chapters=(s.topics||[]).map(t=>({name:t,topics:[]}));
        delete s.topics;
      }
      return s;
    });
    return sub;
  });
}

let config = JSON.parse(JSON.stringify(DEFAULTS));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}

async function loadConfig(){
  try{
    const snap=await getDoc(NT_DOC);
    if(snap.exists()){
      const d=snap.data();
      if(d.gs)       config.gs       = migrate(d.gs);
      if(d.stategk)  config.stategk  = migrate(d.stategk);
      if(d.language) config.language = migrate(d.language);
      if(d.aptitude) config.aptitude = migrate(d.aptitude);
    }
  }catch(e){console.warn('loadConfig',e);}
}
async function save(){await setDoc(NT_DOC,config);toast('✅ Saved');}

// ─── RENDER ───────────────────────────────────────────────────────────────────
const LIST_IDS={gs:'gs-list',stategk:'sgk-list',language:'lang-list',aptitude:'apt-list'};

function renderSection(key,aptRO=false){
  const list=document.getElementById(LIST_IDS[key]);
  list.innerHTML='';
  config[key].forEach((sub,si)=>{
    const card=document.createElement('div');
    card.className='card';
    // ── subsection header
    card.innerHTML=`
      <div class="card-header">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">${sub.icon}</span>
          <div><div class="card-title">${sub.name}</div><span class="card-id">${sub.id}</span></div>
        </div>
        ${!aptRO?`<button class="btn btn-danger" onclick="delSubsection('${key}',${si})">🗑 Delete</button>`:''}
      </div>
    `;
    // ── add subject row (unless aptRO)
    if(!aptRO){
      const addSubjDiv=document.createElement('div');
      addSubjDiv.innerHTML=`
        <div class="section-lbl">📂 Subjects (${(sub.subjects||[]).length})</div>
        <div class="row" style="margin-bottom:6px">
          <input class="auth-input" style="flex:1" placeholder="Add one subject…" id="si-${key}-${si}"/>
          <button class="btn btn-primary" onclick="addOneSubj('${key}',${si})">+ Subject</button>
        </div>
        <div class="bulk-box">
          <div class="bulk-lbl">📋 Bulk add subjects (one per line or comma separated)</div>
          <textarea id="bs-${key}-${si}" placeholder="Ancient India&#10;Medieval India&#10;Modern India" style="min-height:40px"></textarea>
          <button class="btn btn-primary" onclick="bulkSubj('${key}',${si})" style="margin-top:3px">📋 Add All Subjects</button>
        </div>
      `;
      card.appendChild(addSubjDiv);
    }
    // ── subjects
    const subjWrap=document.createElement('div');
    subjWrap.style.marginTop='10px';
    (sub.subjects||[]).forEach((subj,ji)=>{
      subjWrap.appendChild(buildSubjCard(key,si,ji,aptRO));
    });
    card.appendChild(subjWrap);
    list.appendChild(card);
  });
}

function buildSubjCard(key,si,ji,aptRO){
  const subj=config[key][si].subjects[ji];
  const chapCount=(subj.chapters||[]).length;
  const topicTotal=(subj.chapters||[]).reduce((a,c)=>a+(c.topics||[]).length,0);
  const div=document.createElement('div');
  div.className='subj-card';
  div.id=`sc-${key}-${si}-${ji}`;
  div.innerHTML=`
    <div class="subj-header" onclick="toggleNode('sb-${key}-${si}-${ji}','sa-${key}-${si}-${ji}')">
      <div class="subj-name">
        <span class="arrow" id="sa-${key}-${si}-${ji}">▶</span>
        ${subj.name}
        <span class="badge badge-chap">${chapCount} chapters</span>
        <span class="badge badge-topic">${topicTotal} topics</span>
      </div>
      <div style="display:flex;gap:4px" onclick="event.stopPropagation()">
        ${!aptRO?`<button class="btn btn-danger" onclick="delSubj('${key}',${si},${ji})">×</button>`:''}
      </div>
    </div>
    <div class="subj-body" id="sb-${key}-${si}-${ji}">
      <!-- Add chapter controls -->
      <div class="section-lbl" style="margin-left:0">📖 Chapters</div>
      <div class="row" style="margin-bottom:4px">
        <input class="auth-input" style="flex:1" placeholder="Add one chapter…" id="ci-${key}-${si}-${ji}"/>
        <button class="btn btn-blue" onclick="addOneChap('${key}',${si},${ji})">+ Chapter</button>
      </div>
      <div class="bulk-box">
        <div class="bulk-lbl">📋 Bulk add chapters (one per line or comma separated)</div>
        <textarea id="bc-${key}-${si}-${ji}" placeholder="Vedic Period&#10;Mauryan Empire&#10;Gupta Empire" style="min-height:38px"></textarea>
        <button class="btn btn-blue" onclick="bulkChap('${key}',${si},${ji})" style="margin-top:3px">📋 Add All Chapters</button>
      </div>
      <!-- Chapter list -->
      <div id="chaplist-${key}-${si}-${ji}" style="margin-top:8px"></div>
    </div>
  `;
  // render chapters
  setTimeout(()=>renderChapters(key,si,ji),0);
  return div;
}

function renderChapters(key,si,ji){
  const wrap=document.getElementById(`chaplist-${key}-${si}-${ji}`);
  if(!wrap) return;
  wrap.innerHTML='';
  const subj=config[key][si].subjects[ji];
  (subj.chapters||[]).forEach((chap,ci)=>{
    const cd=document.createElement('div');
    cd.className='chap-card';
    cd.id=`cc-${key}-${si}-${ji}-${ci}`;
    cd.innerHTML=`
      <div class="chap-header" onclick="toggleNode('cb-${key}-${si}-${ji}-${ci}','ca-${key}-${si}-${ji}-${ci}')">
        <div class="chap-name">
          <span class="arrow" id="ca-${key}-${si}-${ji}-${ci}">▶</span>
          ${chap.name}
          <span class="badge badge-topic">${(chap.topics||[]).length} topics</span>
        </div>
        <div onclick="event.stopPropagation()" style="display:flex;gap:3px">
          <button class="btn btn-danger" onclick="delChap('${key}',${si},${ji},${ci})">×</button>
        </div>
      </div>
      <div class="chap-body" id="cb-${key}-${si}-${ji}-${ci}">
        <div class="chip-wrap" id="tw-${key}-${si}-${ji}-${ci}"></div>
        <div class="row" style="margin-bottom:4px">
          <input class="auth-input" style="flex:1" placeholder="Add one topic…" id="ti-${key}-${si}-${ji}-${ci}"/>
          <button class="btn btn-green" onclick="addOneTopic('${key}',${si},${ji},${ci})">+</button>
        </div>
        <div class="bulk-box">
          <div class="bulk-lbl">📋 Bulk add topics (one per line or comma separated)</div>
          <textarea id="bt-${key}-${si}-${ji}-${ci}" placeholder="Rig Vedic Society&#10;Later Vedic Age&#10;Economic Life" style="min-height:36px"></textarea>
          <div class="row" style="margin-top:3px">
            <button class="btn btn-green" onclick="bulkTopic('${key}',${si},${ji},${ci})">📋 Add All Topics</button>
            <button class="btn btn-ghost" onclick="clearTopics('${key}',${si},${ji},${ci})">🗑 Clear</button>
          </div>
        </div>
      </div>
    `;
    wrap.appendChild(cd);
    renderTopicChips(key,si,ji,ci);
  });
}

function renderTopicChips(key,si,ji,ci){
  const wrap=document.getElementById(`tw-${key}-${si}-${ji}-${ci}`);
  if(!wrap) return;
  const topics=config[key][si].subjects[ji].chapters[ci].topics||[];
  if(topics.length===0){wrap.innerHTML='<span class="empty-topics">No topics yet</span>';return;}
  wrap.innerHTML='';
  topics.forEach((t,ti)=>{
    const chip=document.createElement('span');
    chip.className='t-chip';
    chip.innerHTML=`${t} <span class="x" onclick="delTopic('${key}',${si},${ji},${ci},${ti})">×</span>`;
    wrap.appendChild(chip);
  });
}

function updateBadges(key,si,ji){
  const subj=config[key][si].subjects[ji];
  const cc=(subj.chapters||[]).length;
  const tc=(subj.chapters||[]).reduce((a,c)=>a+(c.topics||[]).length,0);
  const sc=document.querySelector(`#sc-${key}-${si}-${ji} .badge-chap`);
  const st=document.querySelector(`#sc-${key}-${si}-${ji} .badge-topic`);
  if(sc) sc.textContent=`${cc} chapters`;
  if(st) st.textContent=`${tc} topics`;
}
function updateChapBadge(key,si,ji,ci){
  const tc=(config[key][si].subjects[ji].chapters[ci].topics||[]).length;
  const b=document.querySelector(`#cc-${key}-${si}-${ji}-${ci} .badge-topic`);
  if(b) b.textContent=`${tc} topics`;
}

// ── Toggle ────────────────────────────────────────────────────────────────────
window.toggleNode=(bodyId,arrowId)=>{
  const b=document.getElementById(bodyId);
  const a=document.getElementById(arrowId);
  if(!b) return;
  const open=b.classList.toggle('open');
  if(a) a.classList.toggle('open',open);
};

// ── Subsection ops ────────────────────────────────────────────────────────────
window.delSubsection=(key,si)=>{
  if(!confirm(`Delete "${config[key][si].name}"?`)) return;
  config[key].splice(si,1);
  renderSection(key,key==='aptitude');
  save();
};
window.addSubsection=(key,iconId,nameId,idId,listId)=>{
  const icon=document.getElementById(iconId).value.trim()||'📘';
  const name=document.getElementById(nameId).value.trim();
  const id=document.getElementById(idId).value.trim().toLowerCase().replace(/\s+/g,'-');
  if(!name||!id){toast('⚠️ Name & ID required');return;}
  if(config[key].find(s=>s.id===id)){toast('⚠️ ID exists');return;}
  config[key].push({id,icon,name,subjects:[]});
  document.getElementById(nameId).value='';
  document.getElementById(idId).value='';
  renderSection(key,key==='aptitude');
  save();
};

// ── Subject ops ───────────────────────────────────────────────────────────────
window.addOneSubj=(key,si)=>{
  const inp=document.getElementById(`si-${key}-${si}`);
  const v=inp.value.trim();
  if(!v) return;
  if(!config[key][si].subjects) config[key][si].subjects=[];
  if(config[key][si].subjects.find(s=>s.name===v)){toast('⚠️ Already exists');return;}
  config[key][si].subjects.push({name:v,chapters:[]});
  inp.value='';
  renderSection(key,key==='aptitude');
  save();
};
window.bulkSubj=(key,si)=>{
  const ta=document.getElementById(`bs-${key}-${si}`);
  const items=ta.value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
  if(!items.length){toast('⚠️ Paste subjects first');return;}
  if(!config[key][si].subjects) config[key][si].subjects=[];
  let added=0;
  items.forEach(name=>{
    if(!config[key][si].subjects.find(s=>s.name===name)){
      config[key][si].subjects.push({name,chapters:[]});
      added++;
    }
  });
  ta.value='';
  renderSection(key,key==='aptitude');
  save();
  toast(`✅ Added ${added} subjects`+(items.length-added>0?` (${items.length-added} skipped)`:''));
};
window.delSubj=(key,si,ji)=>{
  if(!confirm(`Delete subject "${config[key][si].subjects[ji].name}"?`)) return;
  config[key][si].subjects.splice(ji,1);
  renderSection(key,key==='aptitude');
  save();
};

// ── Chapter ops ───────────────────────────────────────────────────────────────
window.addOneChap=(key,si,ji)=>{
  const inp=document.getElementById(`ci-${key}-${si}-${ji}`);
  const v=inp.value.trim();
  if(!v) return;
  if(!config[key][si].subjects[ji].chapters) config[key][si].subjects[ji].chapters=[];
  config[key][si].subjects[ji].chapters.push({name:v,topics:[]});
  inp.value='';
  renderChapters(key,si,ji);
  updateBadges(key,si,ji);
  save();
};
window.bulkChap=(key,si,ji)=>{
  const ta=document.getElementById(`bc-${key}-${si}-${ji}`);
  const items=ta.value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
  if(!items.length){toast('⚠️ Paste chapters first');return;}
  if(!config[key][si].subjects[ji].chapters) config[key][si].subjects[ji].chapters=[];
  let added=0;
  items.forEach(name=>{
    if(!config[key][si].subjects[ji].chapters.find(c=>c.name===name)){
      config[key][si].subjects[ji].chapters.push({name,topics:[]});
      added++;
    }
  });
  ta.value='';
  renderChapters(key,si,ji);
  updateBadges(key,si,ji);
  save();
  toast(`✅ Added ${added} chapters`+(items.length-added>0?` (${items.length-added} skipped)`:''));
};
window.delChap=(key,si,ji,ci)=>{
  if(!confirm(`Delete chapter "${config[key][si].subjects[ji].chapters[ci].name}"?`)) return;
  config[key][si].subjects[ji].chapters.splice(ci,1);
  renderChapters(key,si,ji);
  updateBadges(key,si,ji);
  save();
};

// ── Topic ops ─────────────────────────────────────────────────────────────────
window.addOneTopic=(key,si,ji,ci)=>{
  const inp=document.getElementById(`ti-${key}-${si}-${ji}-${ci}`);
  const v=inp.value.trim();
  if(!v) return;
  if(!config[key][si].subjects[ji].chapters[ci].topics) config[key][si].subjects[ji].chapters[ci].topics=[];
  if(config[key][si].subjects[ji].chapters[ci].topics.includes(v)){toast('⚠️ Already exists');return;}
  config[key][si].subjects[ji].chapters[ci].topics.push(v);
  inp.value='';
  renderTopicChips(key,si,ji,ci);
  updateChapBadge(key,si,ji,ci);
  updateBadges(key,si,ji);
  save();
};
window.bulkTopic=(key,si,ji,ci)=>{
  const ta=document.getElementById(`bt-${key}-${si}-${ji}-${ci}`);
  const items=ta.value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
  if(!items.length){toast('⚠️ Paste topics first');return;}
  if(!config[key][si].subjects[ji].chapters[ci].topics) config[key][si].subjects[ji].chapters[ci].topics=[];
  let added=0;
  items.forEach(t=>{
    if(!config[key][si].subjects[ji].chapters[ci].topics.includes(t)){
      config[key][si].subjects[ji].chapters[ci].topics.push(t);
      added++;
    }
  });
  ta.value='';
  renderTopicChips(key,si,ji,ci);
  updateChapBadge(key,si,ji,ci);
  updateBadges(key,si,ji);
  save();
  toast(`✅ Added ${added} topics`+(items.length-added>0?` (${items.length-added} skipped)`:''));
};
window.delTopic=(key,si,ji,ci,ti)=>{
  config[key][si].subjects[ji].chapters[ci].topics.splice(ti,1);
  renderTopicChips(key,si,ji,ci);
  updateChapBadge(key,si,ji,ci);
  updateBadges(key,si,ji);
  save();
};
window.clearTopics=(key,si,ji,ci)=>{
  const t=config[key][si].subjects[ji].chapters[ci].topics||[];
  if(!t.length){toast('Already empty');return;}
  if(!confirm(`Clear all ${t.length} topics?`)) return;
  config[key][si].subjects[ji].chapters[ci].topics=[];
  renderTopicChips(key,si,ji,ci);
  updateChapBadge(key,si,ji,ci);
  updateBadges(key,si,ji);
  save();
};

// ── Section tabs ──────────────────────────────────────────────────────────────
document.querySelectorAll('.sec-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.sec-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.sec).classList.add('active');
  };
});

// ── Auth ──────────────────────────────────────────────────────────────────────
onAuthStateChanged(auth,async user=>{
  if(!user||user.email!==ADMIN_EMAIL){
    document.body.innerHTML='<div style="padding:40px;color:#ef4444;font-size:14px">🔒 Sign in as admin from parent page</div>';
    return;
  }
  await loadConfig();
  renderSection('gs');
  renderSection('stategk');
  renderSection('language');
  renderSection('aptitude',true);
});
</script>
